apiVersion: v2
name: voting-app
description: Production-grade voting app (vote, result, worker, redis, postgres)
type: application
version: 0.1.0
appVersion: "1.0"
# Subcharts pehle se charts/ folder mein hain, isliye "repository" nahi likha.
# (file://charts/... likhne se "helm dependency update" unki .tgz bhi charts/ mein
#  bana deta hai, aur folder + .tgz dono load ho kar har cheez do baar ban sakti hai.)
dependencies:
  - name: vote
    version: 0.1.0
  - name: result
    version: 0.1.0
  - name: worker
    version: 0.1.0
  - name: redis
    version: 0.1.0
    condition: redis.enabled
  - name: db
    version: 0.1.0
    condition: db.enabled
    import-values:                    # child (db) ki value parent mein parhna
      - child: service
        parent: dbService
