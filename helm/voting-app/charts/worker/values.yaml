replicaCount: 1

image:
  repository: voting/worker
  tag: ""
  pullPolicy: IfNotPresent

# Compose ke depends_on ka barabar: in sab ke khulne tak worker start nahi hoga
waitFor:
  - name: db
    port: 5432
  - name: redis
    port: 6379

initImage: busybox:1.36

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 300m, memory: 256Mi }

securityContext:
  readOnlyRootFilesystem: false

podAnnotations: {}
fullnameOverride: ""
