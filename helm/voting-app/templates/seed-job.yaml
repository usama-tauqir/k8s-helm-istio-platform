{{- if .Values.seed.enabled }}
# post-install hook: saari app ban jane ke BAAD fake votes daalta hai.
# Sirf install par chalta hai, upgrade par nahi.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if not .Values.istio.injectHooks }}
      annotations:
        sidecar.istio.io/inject: "false"
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-ops
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      initContainers:
        # Hook pods banne ke baad chalta hai, pods ke READY hone ke baad nahi,
        # isliye pehle vote ke jawab dene ka intezar
        - name: wait-for-vote
          image: {{ .Values.tests.busyboxImage }}
          command: ["sh", "-c", "until wget -q -O /dev/null {{ .Values.seed.voteUrl }}; do echo waiting for vote; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: seed
          image: {{ .Values.seed.image }}
          imagePullPolicy: IfNotPresent
          # Image ki generate-votes.sh par bharosa nahi karte (us mein port hardcoded hai).
          # Wahi kaam yahan: posta/postb files image ke /seed folder mein bani hoti hain.
          # Service "vote" port 80 par sunti hai (-> pod 8080).
          workingDir: /seed
          command:
            - sh
            - -c
            - |
              set -e
              for f in posta postb posta; do
                ab -r -n {{ .Values.seed.requests | default 1000 }} -c {{ .Values.seed.concurrency | default 5 }} -p "$f" -T "application/x-www-form-urlencoded" {{ .Values.seed.voteUrl }}
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 128Mi }
{{- end }}
