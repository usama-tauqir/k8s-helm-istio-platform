apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.dbSecretName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.dbAuth.username | quote }}
  POSTGRES_PASSWORD: {{ required "dbAuth.password lazmi hai: --set dbAuth.password=..." .Values.dbAuth.password | quote }}
