apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-vote
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 65534 }
  containers:
    - name: wget
      image: {{ .Values.tests.busyboxImage }}
      command: ["sh", "-c", "wget -q -O - http://vote:80/ | grep -q '{{ .Values.vote.env.OPTION_A }}' && echo 'vote OK'"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
