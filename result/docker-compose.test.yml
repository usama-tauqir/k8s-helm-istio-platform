version: '2'

services:

  sut:
    build: ./tests/
    depends_on:
      vote:
        condition: service_started
      result:
        condition: service_started
      worker:
        condition: service_started
    networks:
      - front-tier
      - back-tier

  vote:
    build: ../vote/
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier

  result:
    build: .
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier

  worker:
    build: ../worker/
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks:
      - back-tier

networks:
  front-tier:
  back-tier: