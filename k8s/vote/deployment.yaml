apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting
  labels: { app: vote, tier: front, version: v1 }
spec:
  replicas: 2
  selector:
    matchLabels: { app: vote }
  template:
    metadata:
      labels: { app: vote, tier: front, version: v1 }
    spec:
      containers:
        - name: vote
          image: voting/vote:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]