apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: voting
  labels: { app: result, tier: front, version: v1 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: result }
  template:
    metadata:
      labels: { app: result, tier: front, version: v1 }
    spec:
      containers:
        - name: result
          image: voting/result:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: db-secret
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]