apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-vote-worker
  namespace: voting
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: vote } }
        - podSelector: { matchLabels: { app: worker } }
      ports:
        - protocol: TCP
          port: 6379